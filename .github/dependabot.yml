version: 2
updates:
  # Single npm entry at root so dependabot finds the pnpm-lock.yaml
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    # Wait a week after a release before proposing it, so a yanked or
    # quickly-patched version never reaches a PR (zizmor's recommended floor).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "Takishima"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    # Expo SDK pins specific versions of these packages.
    # Do not bump them independently — upgrade via `expo install` when upgrading Expo SDK.
    ignore:
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native-community/netinfo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Pulled in explicitly so they stop drifting as auto-installed peers; their
      # versions come from expo/bundledNativeModules.json, not npm's latest.
      # Expo pins reanimated and worklets to an exact version, so even a patch
      # bump fails `expo install --check` — those two are ignored outright.
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      # gesture-handler uses a tilde range, so patches are in range and welcome.
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # TypeScript major bumps require manual tsconfig migration (baseUrl deprecation,
      # lib changes, etc.). Every package is on TS 6; TS 7 is the Go port.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @react-navigation packages are pinned by Expo SDK — upgrade via `expo install`.
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major"]
      # expo-* modules are versioned per SDK: a major bump drags in the next SDK's
      # modules (59.x) while expo itself stays on 58. Upgrade the whole SDK via
      # `expo install` instead.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      # Expo SDK 58 and the react-native babel preset require @babel/core 7.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # @expo/metro-runtime, @expo/dom-webview and @react-native/metro-config are
      # `*` peers of expo / react-native that pnpm would otherwise auto-install
      # from npm's `latest` tag, which can trail the SDK line in use. They are
      # listed as direct deps in packages/mobile only to pin them to the SDK:
      # the two @expo ones come from bundledNativeModules.json and follow
      # `expo install --fix`; @react-native/metro-config must match the exact
      # react-native version by hand. Do not drop them as "unused". A major
      # bump of the @expo ones is the next SDK; a minor bump of @react-native/*
      # is the next react-native line (0.88 -> 0.89), so both are ignored like
      # expo-* and react-native above.
      - dependency-name: "@expo/metro-runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/dom-webview"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # Group all minor/patch updates into a single PR
      all-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # Group major updates separately so they're visible but consolidated
      all-major:
        update-types:
          - "major"
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
