name: CI - Worker
on:
  push:
    branches: [main]
    paths:
      - 'packages/worker/**'
      - '.github/workflows/ci-worker.yml'
      - '.github/actions/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    paths:
      - 'packages/worker/**'
      - '.github/workflows/ci-worker.yml'
      - '.github/actions/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/worker
      # No ESLint result cache: the type-aware rules depend on types from
      # other files, which ESLint's per-file cache cannot see change.
      - name: Lint
        run: pnpm run lint
      - name: TypeScript Check
        if: ${{ !cancelled() }}
        run: pnpm run typecheck
      - name: Check for dead code
        if: ${{ !cancelled() }}
        run: pnpm run knip
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/worker
      - name: Run tests
        run: pnpm test
