name: CI - Worker
on:
  push:
    branches: [main]
    paths:
      - 'packages/worker/**'
      - '.github/workflows/ci-worker.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'packages/worker/**'
      - '.github/workflows/ci-worker.yml'
      - '.github/actions/**'
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/worker
      # Cache ESLint results per branch
      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/worker/.eslintcache
          key: packages/worker-eslint-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('packages/worker/src/**/*.ts') }}
          restore-keys: |
            packages/worker-eslint-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            packages/worker-eslint-${{ runner.os }}-
      - name: Lint
        run: pnpm run lint --cache --cache-location .eslintcache
      - name: TypeScript Check
        if: ${{ !cancelled() }}
        run: pnpm run typecheck
      - name: Check for dead code
        if: ${{ !cancelled() }}
        run: pnpm run knip
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/worker
      - name: Run tests
        run: pnpm test
