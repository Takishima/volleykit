name: Claude Code
on:
  # claude-code-action only acts on comments from users with write access to
  # the repository and handles the PR checkout itself; the checkout below is
  # the default branch.
  issue_comment: # zizmor: ignore[dangerous-triggers] see above
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
permissions:
  contents: read

jobs:
  claude:
    # The action handles @claude trigger detection internally via trigger_phrase
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository  # zizmor: ignore[artipacked] Claude Code pushes commits and branches from this checkout (contents: write)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          # Allow comments/issues authored by the Claude GitHub app to trigger this workflow
          allowed_bots: 'claude'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            CRITICAL REQUIREMENT: Before doing ANY work, you MUST read and strictly follow the CLAUDE.md file in the repository root.

            The CLAUDE.md file contains mandatory project guidelines including:
            - Code philosophy and naming conventions
            - React best practices (React 19 patterns, no outdated isMountedRef, etc.)
            - Common anti-patterns to avoid (magic numbers, index keys, memory leaks, race conditions)
            - Testing requirements
            - API integration patterns
            - Accessibility requirements
            - CI validation commands that MUST pass
            - Definition of Done criteria

            VERIFICATION CHECKLIST - Before completing any task:
            1. ✅ Read CLAUDE.md first
            2. ✅ Follow all naming conventions (PascalCase components, camelCase hooks, etc.)
            3. ✅ No magic numbers - use named constants
            4. ✅ No array index as React keys
            5. ✅ Clean up all intervals/timeouts/subscriptions
            6. ✅ Use modern React 18+ patterns (no isMountedRef)
            7. ✅ Run full CI validation: pnpm run generate:api && pnpm run lint && pnpm test && pnpm run build
            8. ✅ Ensure accessibility (ARIA attributes, keyboard navigation)

            If your changes don't meet these guidelines, fix them before completing the task.
          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          claude_args: |
            --model opus
            --allowedTools "Bash(pnpm:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),mcp__github__issue_read,mcp__github__issue_write,mcp__github__add_issue_comment,mcp__github__pull_request_read,mcp__github__pull_request_review_write,mcp__github__add_comment_to_pending_review"
