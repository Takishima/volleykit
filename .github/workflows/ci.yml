name: CI
on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'scripts/sync-style-tokens.js'
      - 'docs/api/volleymanager-openapi.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'scripts/sync-style-tokens.js'
      - 'docs/api/volleymanager-openapi.yaml'
      - '.changeset/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
# =============================================================================
# CI Pipeline Architecture
# =============================================================================
#
# Job Dependency Graph:
#
#   setup ─────┬──────────────────────────────────────┐
#   (API types)│                                      │
#              ├──> lint ──────┐                      │
#              ├──> knip (x2)  │                      │
#              ├──> test       │                      │
#              └──> build ─────┼──> bundle-size       │
#                              ├──> e2e (per browser) │
#                              └──> lighthouse        │
#                                                     │
#   audit (independent) ──────────────────────────────┘
#   changeset (PR only, independent) ─────────────────┘
#
# Key Design Decisions:
# - setup job generates API types ONCE, shared via artifact to avoid 4x generation
# - audit runs independently (doesn't need API types)
# - build artifact is shared by bundle-size, e2e, and lighthouse
# - Tool caches (ESLint, Vitest, Vite) keyed by config, not source files for better reuse
# - PRs run chromium only; main branch runs chromium + firefox + webkit
# - E2E uses pre-built Playwright Docker image (no browser install overhead)
#
# =============================================================================
permissions:
  contents: read

jobs:
  # Setup job - generates API types once, shared by all downstream jobs
  # This is the CRITICAL PATH for lint, knip, test, and build jobs
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      api-cache-key: ${{ steps.api-cache-key.outputs.key }}
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Generate API cache key
        id: api-cache-key
        run: echo "key=api-types-v2-${{ hashFiles('docs/api/volleymanager-openapi.yaml', 'pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
      - name: Cache generated API types
        id: api-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/shared/src/api/schema.ts
          key: ${{ steps.api-cache-key.outputs.key }}
      - name: Generate API types
        if: steps.api-cache.outputs.cache-hit != 'true'
        run: pnpm run generate:api
      # Upload API types as artifact for downstream jobs
      # Both paths are needed so upload-artifact preserves the packages/ directory
      # structure (LCA). Web schema.ts is a thin re-export, not generated.
      - name: Upload API types
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-types
          path: |
            packages/shared/src/api/schema.ts
            packages/web/src/api/schema.ts
          retention-days: 1
  # Design token sync check - ensures colors.js matches design-tokens.css
  tokens:
    name: Token Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check token sync
        run: node scripts/sync-style-tokens.js --check
  # Security audit - runs independently (doesn't need API types)
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Audit dependencies
        run: |
          # Space-separated GHSA ids to suppress. Keep this empty unless an
          # advisory genuinely has no fix: a stale entry lets a regression on
          # that advisory ship green. An entry may carry a version prefix
          # (GHSA-xxxx@3.): it then applies only while every finding of that
          # advisory resolves to a version starting with the prefix, so a
          # regression on another line still fails the gate.
          # - GHSA-vfj7-8cjw-p6xm (braces ReDoS, via expo > @expo/metro > micromatch)
          #   has no patched release: the advisory lists every published version
          #   as vulnerable (latest braces 3.0.3). Drop once a fixed version ships
          #   and expo picks it up.
          # - node-forge (via expo > @expo/cli) and follow-redirects are held at
          #   their patched lines by `pnpm.overrides` in the root package.json
          #   rather than ignored here; remove the overrides once expo depends on
          #   the fixed versions itself.
          # - GHSA-mrhx-c7xc-m3w5 (zod array-parse OOM, via expo > @expo/cli > zod 3.25.76)
          #   is fixed only on the 4.x line (4.6.6), which every workspace already
          #   uses; no patched 3.x release exists. @expo/cli only parses local
          #   config at build time. Scoped to 3.x so a direct zod 4 below 4.6.6
          #   still fails. Drop once @expo/cli moves to zod 4.
          IGNORED_ADVISORIES="GHSA-vfj7-8cjw-p6xm GHSA-mrhx-c7xc-m3w5@3."
          # pnpm audit emits the npm v6 report shape: advisories keyed by id, each
          # carrying github_advisory_id, module_name and the dependency paths.
          # pnpm audit exits non-zero whenever it finds something, so the exit code
          # is not an error signal; the report shape is. A registry error, timeout
          # or empty body must fail the gate rather than read as "no advisories".
          AUDIT_JSON=$(pnpm audit --audit-level high --prod --json 2>/dev/null || true)
          if ! echo "$AUDIT_JSON" | jq -e '.metadata.vulnerabilities and (.advisories | type == "object")' >/dev/null 2>&1; then
            echo "::error::pnpm audit returned no usable report"
            echo "$AUDIT_JSON" | head -c 2000
            exit 1
          fi
          # Filter severity here too so the gate does not depend on --audit-level
          # also pruning the JSON report.
          # The last field lists every resolved version the advisory was found
          # on, comma-separated, so a version-scoped ignore can check them all.
          FOUND=$(echo "$AUDIT_JSON" | jq -r '.advisories[] | select(.severity == "high" or .severity == "critical") | "\(.github_advisory_id)|\(.severity)|\(.module_name)|\([.findings[].version] | unique | join(","))"')

          UNIGNORED=""
          for entry in $FOUND; do
            GHSA="${entry%%|*}"
            VERSIONS="${entry##*|}"
            MATCHED=false
            for ignored in $IGNORED_ADVISORIES; do
              IGNORED_ID="${ignored%%@*}"
              if [ "$GHSA" != "$IGNORED_ID" ]; then continue; fi
              if [ "$ignored" = "$IGNORED_ID" ]; then
                MATCHED=true
                continue
              fi
              PREFIX="${ignored#*@}"
              # No recorded versions means nothing to scope on: fail closed.
              ALL_MATCH=true
              if [ -z "$VERSIONS" ]; then ALL_MATCH=false; fi
              for version in ${VERSIONS//,/ }; do
                case "$version" in
                  "$PREFIX"*) ;;
                  *) ALL_MATCH=false ;;
                esac
              done
              if [ "$ALL_MATCH" = "true" ]; then MATCHED=true; fi
            done
            if [ "$MATCHED" = "true" ]; then
              echo "Ignoring $entry"
            else
              UNIGNORED="$UNIGNORED $entry"
            fi
          done

          if [ -n "$(echo "$UNIGNORED" | xargs)" ]; then
            echo "::error::New vulnerabilities found:$UNIGNORED"
            pnpm audit --audit-level high --prod
            exit 1
          fi
          echo "All vulnerabilities are known/ignored. Audit passed."
  # Lint check - needs API types from setup
  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Download API types
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-types
          path: packages
      # No ESLint result cache: the type-aware rules depend on types from
      # other files, which ESLint's per-file cache cannot see change.
      - name: Lint
        run: pnpm run lint
  # Dead code detection - needs API types from setup
  knip:
    name: Dead Code Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      # setup-node-deps caches only the root and packages/web node_modules, and
      # skips installing when both keys hit. This job also needs
      # packages/shared/node_modules, which nothing caches, so install
      # unconditionally. Idempotent and near-free when everything is present.
      - name: Ensure every workspace has its dependencies
        run: pnpm install --frozen-lockfile
      - name: Download API types
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-types
          path: packages
      # One --filter per package, not a single multi-filter run: pnpm exits 0
      # when *some* selected packages lack the script and only fails when none
      # has it, so a multi-filter run would silently drop a package whose script
      # was renamed — the bug this gate exists to catch. A single filter exits 1.
      # The loop keeps going so one failing package still reports the other.
      # Mobile runs its own knip in ci-mobile.yml, the workflow its changes trigger.
      - name: Check for dead code
        run: |
          status=0
          for pkg in volleykit-web @volleykit/shared; do
            echo "::group::knip ($pkg)"
            pnpm --filter "$pkg" --fail-if-no-match run knip || status=1
            echo "::endgroup::"
          done
          exit "$status"
  # Unit tests - needs API types from setup
  # PRs: only run tests affected by changed files (--changed)
  # main: run all tests for full coverage validation
  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history needed for --changed to compare against base branch
          fetch-depth: 0
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Download API types
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-types
          path: packages
      # Cache Vite/Vitest transform cache (Vitest stores cache in .vite/vitest)
      # Key based on tooling config - source file changes don't invalidate transforms
      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/web/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/web/vite.config.ts', 'packages/web/tsconfig.json') }}
          restore-keys: |
            vite-${{ runner.os }}-
      - name: Run tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PRs: only run tests affected by changes since base branch
            pnpm test --changed "origin/$BASE_REF"
          else
            # main branch: run all tests
            pnpm test
          fi
  # Build once - artifact shared by bundle-size, e2e, and lighthouse
  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Download API types
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-types
          path: packages
      # Cache Vite pre-bundled dependencies (shared key with test job)
      # Key based on dependencies and config - source changes don't affect dep pre-bundling
      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/web/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/web/vite.config.ts', 'packages/web/tsconfig.json') }}
          restore-keys: |
            vite-${{ runner.os }}-
      - name: Build
        run: pnpm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app-dist
          path: packages/web/dist
          retention-days: 1
  # Bundle size check - lightweight job, only needs build artifact
  bundle-size:
    name: Bundle Size
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app-dist
          path: packages/web/dist
      - name: Check bundle size
        run: pnpm run size
  # E2E tests - per browser, uses build artifact
  # PRs: chromium only (fast feedback)
  # main: chromium + firefox + webkit (full coverage)
  # Uses pre-built Playwright Docker image (browsers pre-installed)
  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # PRs: chromium only; main: all browsers
        browser: ${{ github.event_name == 'pull_request' && fromJson('["chromium"]') || fromJson('["chromium", "firefox", "webkit"]') }}
    defaults:
      run:
        working-directory: packages/web
    # Firefox requires HOME to be owned by current user in containers
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app-dist
          path: packages/web/dist
      - name: Run E2E tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright test --project="$BROWSER" --retries=2
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: packages/web/playwright-report/
          retention-days: 7
  # Lighthouse performance audit - uses build artifact
  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app-dist
          path: packages/web/dist
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          configPath: ./packages/web/lighthouserc.json
  # Changeset check - ensures PRs include changelog entries
  # Only runs on PRs, reports missing changesets (informational)
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Pinned to the version in pnpm-lock.yaml. Installed globally because this
      # job never runs pnpm install, so there is no lockfile-backed install to use.
      - name: Install changeset CLI # zizmor: ignore[adhoc-packages] version pinned to the lockfile's
        run: pnpm add -g @changesets/cli@3.0.3
      - name: Check for changesets
        id: changeset_check
        run: |
          # Count changeset files (excluding config.json and README.md)
          CHANGESET_COUNT=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

          if [ "$CHANGESET_COUNT" -eq 0 ]; then
            echo "has_changeset=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No changeset found. If this PR includes user-facing changes, please run 'pnpm exec changeset' to add a changelog entry."
          else
            echo "has_changeset=true" >> "$GITHUB_OUTPUT"
            echo "Found $CHANGESET_COUNT changeset(s)"
          fi
      - name: Summary
        env:
          HAS_CHANGESET: ${{ steps.changeset_check.outputs.has_changeset }}
        run: |
          if [ "$HAS_CHANGESET" = "true" ]; then
            echo "## Changeset Found" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This PR includes changelog entries." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## No Changeset" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This PR does not include a changeset." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "If this PR includes user-facing changes (features, fixes), please add a changeset:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo 'pnpm exec changeset' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "If this PR is docs-only or internal, no changeset is needed." >> "$GITHUB_STEP_SUMMARY"
          fi
