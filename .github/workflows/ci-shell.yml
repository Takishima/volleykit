name: CI Shell

# The validation scripts and the commit hook decide whether every Claude Code
# commit proceeds, so they get the same static analysis as the rest of the repo.
# validate.sh registers the same lint locally when shellcheck is installed; this
# job is what enforces it where it is not (the Claude Code web container).

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.claude/hooks/**'
      - '.claude/skills/**'
      - '.claude/settings.json'
      - 'packages/web/scripts/**'
      - '.github/workflows/ci-shell.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.claude/hooks/**'
      - '.claude/skills/**'
      - '.claude/settings.json'
      - 'packages/web/scripts/**'
      - '.github/workflows/ci-shell.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships on ubuntu-latest; no install step needed.
      # One definition of what is linted and how: scripts/shellcheck.sh, which
      # validate.sh also sources so the trigger, cache key and argv agree.
      - name: Lint shell scripts
        run: bash scripts/shellcheck.sh

  shell-tests:
    name: shell test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the validation suites
        run: |
          bash scripts/validation-lib.test.sh
          bash scripts/validate.test.sh
