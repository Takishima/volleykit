name: CI Shell

# The validation scripts and the commit hook decide whether every Claude Code
# commit proceeds, so they get the same static analysis as the rest of the repo.
# shellcheck is not available in the Claude Code web container, so this runs in
# CI rather than as a registered check in scripts/validate.sh.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.sh'
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - '.github/workflows/ci-shell.yml'
  pull_request:
    paths:
      - 'scripts/**.sh'
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - '.github/workflows/ci-shell.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships on ubuntu-latest; no install step needed.
      # `info` is included because SC2086 (unquoted expansion) lives there, and
      # that is the class this code has tripped on repeatedly. Only two rules
      # are excluded repo-wide, both structural: SC1091 cannot follow a sourced
      # path it was not given, and SC2015 flags the `a && b || c` the test
      # helpers use deliberately. SC2016 is a real defect class elsewhere, so it
      # is disabled inline at the two constants that need it.
      - name: Lint shell scripts
        run: shellcheck -x --severity=info -e SC1091,SC2015 scripts/*.sh .claude/hooks/*.sh .claude/hooks/lib/*.sh

  shell-tests:
    name: shell test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the validation suites
        run: |
          bash scripts/validation-lib.test.sh
          bash scripts/validate.test.sh
