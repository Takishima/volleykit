name: Deploy PR Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'docs/api/volleymanager-openapi.yaml'
      - 'ocr-poc/**'
      - 'help-site/**'
      - '.github/workflows/deploy-pr-preview.yml'
      - '.github/actions/**'
permissions:
  contents: read
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  # Build jobs run in parallel
  build-web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      # Cache generated API types (shared across branches)
      - name: Cache generated API types
        id: api-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/web/src/api/schema.ts
            packages/shared/src/api/schema.ts
          key: api-types-v2-${{ hashFiles('docs/api/volleymanager-openapi.yaml', 'pnpm-lock.yaml') }}
      - name: Generate API types
        if: steps.api-cache.outputs.cache-hit != 'true'
        run: pnpm run generate:api
      # Lint and test are handled by the CI workflow (ci.yml)
      - name: Build for PR Preview
        run: pnpm run build
        env:
          VITE_DEMO_MODE_ONLY: 'true'
          VITE_API_PROXY_URL: ${{ vars.VITE_API_PROXY_URL }}
          VITE_BASE_PATH: /pr-${{ github.event.pull_request.number }}/
          VITE_OJP_API_KEY: ${{ secrets.VITE_OJP_API_KEY }}
          VITE_OCR_ENDPOINT: ${{ vars.VITE_OCR_ENDPOINT }}
      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll
      - name: Upload packages/web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app-dist
          path: packages/web/dist
          retention-days: 1
  build-help-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: help-site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: help-site
          node-version: '22'
      # Cache Astro build artifacts per branch
      - name: Cache Astro build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: help-site/node_modules/.astro
          key: astro-${{ runner.os }}-${{ github.head_ref }}-${{ hashFiles('help-site/src/**/*', 'help-site/astro.config.mjs') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ github.head_ref }}-
            astro-${{ runner.os }}-
      - name: Build Help Site
        run: pnpm run build
        env:
          ASTRO_BASE_PATH: /pr-${{ github.event.pull_request.number }}/help
      - name: Upload help-site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: help-site-dist
          path: help-site/dist
          retention-days: 1
  build-ocr-poc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-poc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: ocr-poc
      # Cache Vite build artifacts per branch
      - name: Cache Vite build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ocr-poc/node_modules/.vite
          key: ocr-poc-vite-${{ runner.os }}-${{ github.head_ref }}-${{ hashFiles('ocr-poc/src/**/*.ts', 'ocr-poc/src/**/*.tsx', 'ocr-poc/vite.config.ts') }}
          restore-keys: |
            ocr-poc-vite-${{ runner.os }}-${{ github.head_ref }}-
            ocr-poc-vite-${{ runner.os }}-
      - name: Build OCR POC
        run: pnpm run build
        env:
          VITE_BASE_PATH: /pr-${{ github.event.pull_request.number }}/ocr-poc/
          VITE_OCR_ENDPOINT: ${{ vars.VITE_OCR_ENDPOINT }}
      - name: Upload ocr-poc artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-poc-dist
          path: ocr-poc/dist
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: [build-web-app, build-help-site, build-ocr-poc]
    permissions:
      contents: write # actions-gh-pages pushes the gh-pages branch
      pull-requests: write # preview-link comment on the PR
    steps:
      - name: Checkout  # zizmor: ignore[artipacked] actions-gh-pages pushes the gh-pages branch from this checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download packages/web artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app-dist
          path: web-app-dist
      - name: Download help-site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: help-site-dist
          path: help-site-dist
      - name: Download ocr-poc artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-poc-dist
          path: ocr-poc-dist
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        continue-on-error: true
        with:
          name: |
            web-app-dist
            help-site-dist
            ocr-poc-dist
      - name: Download existing gh-pages content
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            echo "Cloning existing gh-pages branch..."
            git clone --depth 1 --branch gh-pages \
              https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git \
              gh-pages-current
          else
            echo "gh-pages branch does not exist yet, starting fresh"
          fi
      - name: Prepare deployment with PR preview
        run: |
          mkdir -p deploy
          # Copy existing content (if any) preserving main site
          if [ -d "gh-pages-current" ]; then
            rsync -a --exclude='.git' gh-pages-current/ deploy/
          fi
          # Add/update this PR's preview (packages/web)
          mkdir -p deploy/pr-${{ github.event.pull_request.number }}
          cp -r web-app-dist/* deploy/pr-${{ github.event.pull_request.number }}/
          # Add/update OCR POC preview
          mkdir -p deploy/pr-${{ github.event.pull_request.number }}/ocr-poc
          cp -r ocr-poc-dist/* deploy/pr-${{ github.event.pull_request.number }}/ocr-poc/
          # Add/update Help Site preview
          mkdir -p deploy/pr-${{ github.event.pull_request.number }}/help
          cp -r help-site-dist/* deploy/pr-${{ github.event.pull_request.number }}/help/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          keep_files: false
          enable_jekyll: false
          cname: volleykit.ch
      - name: Comment PR with preview link
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const previewUrl = `https://volleykit.ch/pr-${{ github.event.pull_request.number }}/`;
            const ocrPocUrl = `${previewUrl}ocr-poc/`;
            const helpUrl = `${previewUrl}help/`;
            const body = `## PR Preview Deployed!\n\n` +
              `Your preview is ready at: ${previewUrl}\n\n` +
              `**OCR POC:** ${ocrPocUrl}\n\n` +
              `**Help Site:** ${helpUrl}\n\n` +
              `> This preview will be updated on each push to this PR.\n\n` +
              `**Preview Mode:** Calendar mode login (read-only) and demo mode are available. Full login is disabled for security.`;

            // Check if comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body.includes('PR Preview Deployed'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
