name: CI Mobile
on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'docs/api/volleymanager-openapi.yaml'
      - '.github/workflows/ci-mobile.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'docs/api/volleymanager-openapi.yaml'
      - '.github/workflows/ci-mobile.yml'
      - '.github/actions/**'
# =============================================================================
# Mobile CI Pipeline
# =============================================================================
#
# Job Dependency Graph:
#
#   setup ─────┬──> typecheck
#   (API types)├──> lint
#              └──> test
#
# =============================================================================
permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      api-cache-key: ${{ steps.api-cache-key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/mobile
      - name: Generate API cache key
        id: api-cache-key
        run: echo "key=api-types-${{ hashFiles('docs/api/volleymanager-openapi.yaml', 'pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT
      - name: Cache generated API types
        id: api-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shared/src/api/schema.ts
          key: ${{ steps.api-cache-key.outputs.key }}
      - name: Generate API types
        if: steps.api-cache.outputs.cache-hit != 'true'
        run: pnpm --filter volleykit-web exec openapi-typescript ../../docs/api/volleymanager-openapi.yaml -o ../shared/src/api/schema.ts
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/mobile
      - name: Restore API types cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shared/src/api/schema.ts
          key: ${{ needs.setup.outputs.api-cache-key }}
      - name: TypeScript Check
        run: pnpm run typecheck
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/mobile
      - name: Restore API types cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shared/src/api/schema.ts
          key: ${{ needs.setup.outputs.api-cache-key }}
      - name: Run ESLint
        run: pnpm run lint
      # Lives here rather than in ci.yml's Dead Code Check: that workflow does
      # not trigger on packages/mobile/**, so a mobile-only PR would never run it.
      # Runs even when ESLint fails, so a lint error cannot hide a knip finding.
      - name: Check for dead code
        if: ${{ !cancelled() }}
        run: pnpm run knip
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/mobile
      - name: Restore API types cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shared/src/api/schema.ts
          key: ${{ needs.setup.outputs.api-cache-key }}
      - name: Run Tests
        run: pnpm test --passWithNoTests
