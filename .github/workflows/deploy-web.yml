name: Deploy Web App to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'docs/api/volleymanager-openapi.yaml'
      - 'packages/worker/**'
      - 'ocr-poc/**'
      - 'help-site/**'
      - '.github/workflows/deploy-web.yml'
      - '.github/actions/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    # Only deploy worker if Cloudflare secrets are configured
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: packages/worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/worker
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  # Build jobs run in parallel
  build-web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: packages/web
      - name: Cache generated API types
        id: api-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/web/src/api/schema.ts
            packages/shared/src/api/schema.ts
          key: api-types-v2-${{ hashFiles('docs/api/volleymanager-openapi.yaml', 'pnpm-lock.yaml') }}
      - name: Generate API types
        if: steps.api-cache.outputs.cache-hit != 'true'
        run: pnpm run generate:api
      # Cache ESLint results
      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/web/.eslintcache
          key: eslint-${{ runner.os }}-main-${{ hashFiles('packages/web/src/**/*.ts', 'packages/web/src/**/*.tsx') }}
          restore-keys: |
            eslint-${{ runner.os }}-main-
            eslint-${{ runner.os }}-
      - name: Lint
        run: pnpm run lint --cache --cache-location .eslintcache
      # Cache Vite/Vitest artifacts (Vitest stores cache in .vite/vitest)
      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/web/node_modules/.vite
          key: vite-${{ runner.os }}-main-${{ hashFiles('pnpm-lock.yaml', 'packages/web/vite.config.ts', 'packages/web/tsconfig.json') }}
          restore-keys: |
            vite-${{ runner.os }}-main-
            vite-${{ runner.os }}-
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
        env:
          VITE_API_PROXY_URL: ${{ vars.VITE_API_PROXY_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_OJP_API_KEY: ${{ secrets.VITE_OJP_API_KEY }}
          VITE_OCR_ENDPOINT: ${{ vars.VITE_OCR_ENDPOINT }}
      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll
      - name: Upload packages/web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app-dist
          path: packages/web/dist
          retention-days: 1
  build-help-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: help-site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: help-site
          node-version: '22'
      # Cache Astro build artifacts
      - name: Cache Astro build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: help-site/node_modules/.astro
          key: astro-${{ runner.os }}-main-${{ hashFiles('help-site/src/**/*', 'help-site/astro.config.mjs') }}
          restore-keys: |
            astro-${{ runner.os }}-main-
            astro-${{ runner.os }}-
      - name: Build Help Site
        run: pnpm run build
        env:
          ASTRO_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}help
      - name: Upload help-site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: help-site-dist
          path: help-site/dist
          retention-days: 1
  build-ocr-poc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-poc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js with dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          working-directory: ocr-poc
      # Cache ESLint results
      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ocr-poc/.eslintcache
          key: ocr-poc-eslint-${{ runner.os }}-main-${{ hashFiles('ocr-poc/src/**/*.ts', 'ocr-poc/src/**/*.tsx') }}
          restore-keys: |
            ocr-poc-eslint-${{ runner.os }}-main-
            ocr-poc-eslint-${{ runner.os }}-
      - name: Lint OCR PoC
        run: pnpm run lint --cache --cache-location .eslintcache
      # Cache Vite build artifacts
      - name: Cache Vite build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ocr-poc/node_modules/.vite
          key: ocr-poc-vite-${{ runner.os }}-main-${{ hashFiles('ocr-poc/src/**/*.ts', 'ocr-poc/src/**/*.tsx', 'ocr-poc/vite.config.ts') }}
          restore-keys: |
            ocr-poc-vite-${{ runner.os }}-main-
            ocr-poc-vite-${{ runner.os }}-
      - name: Build OCR PoC
        run: pnpm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}ocr-poc/
          VITE_OCR_ENDPOINT: ${{ vars.VITE_OCR_ENDPOINT }}
      - name: Upload ocr-poc artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-poc-dist
          path: ocr-poc/dist
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: [deploy-worker, build-web-app, build-help-site, build-ocr-poc]
    # Run if all builds succeeded; worker can be skipped (Cloudflare not configured)
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write # actions-gh-pages pushes the gh-pages branch
    steps:
      - name: Checkout  # zizmor: ignore[artipacked] actions-gh-pages pushes the gh-pages branch from this checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download packages/web artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app-dist
          path: deploy
      - name: Download help-site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: help-site-dist
          path: deploy/help
      - name: Download ocr-poc artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-poc-dist
          path: deploy/ocr-poc
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        continue-on-error: true
        with:
          name: |
            web-app-dist
            help-site-dist
            ocr-poc-dist
      - name: Download existing gh-pages content
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            echo "Cloning existing gh-pages branch..."
            git clone --depth 1 --branch gh-pages \
              https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git \
              gh-pages-current
          else
            echo "gh-pages branch does not exist yet, starting fresh"
          fi
      - name: Preserve PR preview subdirectories
        run: |
          if [ -d "gh-pages-current" ]; then
            shopt -s nullglob
            for pr_dir in gh-pages-current/pr-*/; do
              [ -d "$pr_dir" ] && cp -r "$pr_dir" deploy/
            done
          fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          keep_files: false
          enable_jekyll: false
          cname: volleykit.ch
